# ═══════════════════════════════════════════════════════════════
# 宿主机 nginx 反向代理（无 443，仅 80）
# 作用：把 xianglongshibazhang.com 的流量反代到 K8s NodePort 30088
# 用法：
#   cp nginx-proxy.conf /etc/nginx/conf.d/xianglongshibazhang.conf
#   nginx -t && nginx -s reload
# DNS：域名 A 记录指向本机公网 IP
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name xianglongshibazhang.com www.xianglongshibazhang.com;

    access_log /var/log/nginx/xianglongshibazhang.access.log;
    error_log  /var/log/nginx/xianglongshibazhang.error.log;

    # 客户端上传体积（纯静态站足够）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:30088;   # K8s NodePort

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # 收款码等图片多缓存一层
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
        proxy_pass http://127.0.0.1:30088;
        proxy_cache_valid 200 7d;
        expires 7d;
    }
}

# ═══════════════════════════════════════════════════════════════
# 降龙十八掌 · 江湖传功堂 —— K8s 部署清单
# 前置条件：
#   1. 静态文件需先拷贝到节点目录：/data/git/test/xianglongshibazhang
#      （目录里应有 index.html 和 assets/，多节点集群请保证每个节点都有该目录，
#        或去掉注释改用 nodeSelector 固定调度到某一节点）
#   2. 集群已安装 ingress-nginx
# 部署：kubectl apply -f deploy.yaml
# ═══════════════════════════════════════════════════════════════

# ── 命名空间 ──────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: xianglongshibazhang
  labels:
    app.kubernetes.io/name: xianglongshibazhang

---
# ── nginx 站点配置（监听 8080，serve 静态文件）─────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: xl18z-nginx-conf
  namespace: xianglongshibazhang
data:
  default.conf: |
    server {
        listen 8080;
        server_name a.xianglongshibazhang.com;

        root  /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # 静态资源缓存 7 天（收款码图片也在此列）
        location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|css|js|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        gzip on;
        gzip_min_length 1k;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;

        access_log /var/log/nginx/xl18z.access.log;
        error_log  /var/log/nginx/xl18z.error.log;
    }

---
# ── Deployment：nginx 容器跑静态站 ────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xl18z-web
  namespace: xianglongshibazhang
  labels:
    app: xl18z-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xl18z-web
  template:
    metadata:
      labels:
        app: xl18z-web
    spec:
      # 多节点时固定调度到存放了静态文件的节点（按需放开并修改节点名）：
      # nodeSelector:
      #   kubernetes.io/hostname: node-01
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: html                     # 静态文件：宿主机目录
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf               # 站点配置：ConfigMap
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: html
          hostPath:
            path: /data/git/test/xianglongshibazhang
            type: Directory                 # 目录不存在则 Pod 起不来，便于及早发现
        - name: nginx-conf
          configMap:
            name: xl18z-nginx-conf

---
# ── Service：NodePort 30088 ───────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: xl18z-web
  namespace: xianglongshibazhang
  labels:
    app: xl18z-web
spec:
  type: NodePort
  selector:
    app: xl18z-web
  ports:
    - name: http
      port: 8080          # Service 端口
      targetPort: 8080    # 容器端口
      protocol: TCP
      nodePort: 30088     # 节点对外端口（30000-32767 随便选的）

---
# ── Ingress：a.xianglongshibazhang.com（仅 HTTP，无 443）───────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xl18z-web
  namespace: xianglongshibazhang
  labels:
    app: xl18z-web
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"   # 不跳 https
spec:
  ingressClassName: nginx
  rules:
    - host: a.xianglongshibazhang.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xl18z-web
                port:
                  number: 8080
